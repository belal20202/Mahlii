name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name mahalli --org com.Mahlli
          fi
          # اسم الحزمة النهائي
          for F in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$F" ] && sed -i 's/applicationId *=\? *"[^"]*"/applicationId = "com.Mahlli.Belal"/' "$F"
          done
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in CAMERA INTERNET ACCESS_NETWORK_STATE; do
            grep -q "android.permission.$P" $MANIFEST || \
              sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$P\"\/>\n    <application/" $MANIFEST
          done
          sed -i 's/android:label="[^"]*"/android:label="محلي"/' $MANIFEST
          # Firebase يتطلب minSdk 23 على الأقل
          sed -i 's/flutter\.minSdkVersion/23/' android/app/build.gradle* || true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }} \
            --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }} \
            --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }} \
            --dart-define=FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }} \
            --dart-define=SUPPORT_WHATSAPP=${{ secrets.SUPPORT_WHATSAPP }}

      - uses: actions/upload-artifact@v4
        with:
          name: mahalli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
