name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name mahalli --org iq.mahalli
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $MANIFEST || \
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' $MANIFEST
          sed -i 's/android:label="[^"]*"/android:label="محلي"/' $MANIFEST

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mahalli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
